name: Release

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev
          - prod
        default: 'dev'
      tag:
        description: 'Release tag (e.g., 1.0.0 or auto for automatic generation)'
        required: true
        default: 'auto'

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  JAVA_VERSION: '21'
  MAVEN_OPTS: -Xmx1024m

jobs:
  generate-tag:
    runs-on: ubuntu-latest
    permissions: write-all
    outputs:
      environment: ${{ steps.generate-tag.outputs.environment }}
      new-version: ${{ steps.generate-tag.outputs.new-version }}
    env:
      ENVIRONMENT: ${{ github.event.inputs.environment }}
      INPUT_TAG: ${{ github.event.inputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ env.GH_TOKEN }}
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Generate release tag
        id: generate-tag
        run: |
          get_latest_dev_tag() {
            git tag -l "*-dev" | sort -V | tail -n 1
          }
          
          increment_version() {
            local version="$1"
            if [[ $version =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              local major=${BASH_REMATCH[1]}
              local minor=${BASH_REMATCH[2]}
              local patch=${BASH_REMATCH[3]}
              echo "${major}.${minor}.$((patch + 1))"
            else
              echo "1.0.0"
            fi
          }
          
          extract_version() {
            local tag="$1"
            local env="$2"
            echo "$tag" | sed "s/-${env}$//"
          }
          
          git fetch --tags

          LATEST_DEV_TAG=$(git tag -l "*-dev" | sort -V | tail -n 1)
          LATEST_DEV_VER=$(extract_version "$LATEST_DEV_TAG" "dev")
          INCREMENTED_VER=$(increment_version "$LATEST_DEV_VER")
          NEW_VERSION=""
          
          if [ "$INPUT_TAG" = "auto" ]; then
            NEW_VERSION="$INCREMENTED_VER"
            if [ "$ENVIRONMENT" != "dev" ]; then
              NEW_VERSION="$LATEST_DEV_VER"
            fi
          else
            NEW_VERSION="$INPUT_TAG"
          fi
          
          # Update pom.xml version and commit changes
          if [ "$ENVIRONMENT" = "dev" ]; then
            echo "Updating pom.xml version to $NEW_VERSION"
            
            # Update all pom.xml files (root and modules)
            mvn versions:set -DnewVersion="$NEW_VERSION" -DgenerateBackupPoms=false
            
            # Commit the version changes
            git add .
            git commit -m "chore: bump version to $NEW_VERSION" || echo "No version changes to commit"
          fi
          
          # Create git tag
          TAG="$NEW_VERSION-$ENVIRONMENT"
          if [ "$ENVIRONMENT" = "dev" ]; then
            git tag "$TAG"
          else
            # For non-dev, point to the corresponding dev tag commit
            git tag "$TAG" "$NEW_VERSION-dev^{commit}"
          fi
          
          git push origin "$TAG"

          echo "new-version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT

  build-and-push:
    runs-on: ubuntu-latest
    needs: generate-tag
    if: ${{ github.event.inputs.environment == 'dev' }}
    env:
      NEW_VERSION: ${{ needs.generate-tag.outputs.new-version }}
      ENVIRONMENT: ${{ needs.generate-tag.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.NEW_VERSION }}-${{ env.ENVIRONMENT }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Publish Docker image
        run: |
          mvn package jib:build -DskipTests -Ddocker.tag="${NEW_VERSION}-dev"

  promote-images:
    runs-on: ubuntu-latest
    needs: generate-tag
    if: ${{ github.event.inputs.environment != 'dev' }}
    env:
      NEW_VERSION: ${{ needs.generate-tag.outputs.new-version }}
      ENVIRONMENT: ${{ needs.generate-tag.outputs.environment }}
      SERVICES: 'payments,backoffice,corebanking'
    steps:
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Setup Crane
        uses: imjasonh/setup-crane@v0.1
        
      - name: Promote Docker images
        run: |  
          services=($(echo "$SERVICES" | tr ',' '\n'))
          for service in ${services[@]}; do
            SOURCE_IMAGE="samirachoscalac/akka-demo:${service}-${NEW_VERSION}-dev"
            TARGET_IMAGE="samirachoscalac/akka-demo:${service}-${NEW_VERSION}-${ENVIRONMENT}" 
            echo "Promoting $SOURCE_IMAGE to $TARGET_IMAGE"
            crane tag "$SOURCE_IMAGE" "${service}-${NEW_VERSION}-${ENVIRONMENT}"
          done

  create-release-pr:
    runs-on: ubuntu-latest
    needs: [generate-tag, build-and-push, promote-images]
    if: always() && (needs.build-and-push.result == 'success' || needs.promote-images.result == 'success')
    env:
      TARGET_REPO: 'aklikic/akka-release-repo'
      TARGET_BRANCH: 'main'
      DESCRIPTOR_PATH: '${{ github.event.inputs.environment }}/gcp-us-east1/fintech-demo/'
      ENVIRONMENT: ${{ needs.generate-tag.outputs.environment }}
      NEW_VERSION: ${{ needs.generate-tag.outputs.new-version }}
      USE_SAME_DOCKER_REPO: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Clone target repository
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git target-repo
          cd target-repo
          git checkout $TARGET_BRANCH || git checkout -b $TARGET_BRANCH

      - name: Create branch and update service descriptors
        run: |
          # Set PR branch name using generated tag
          PR_BRANCH_NAME="release-${NEW_VERSION}-${{ github.run_id }}"
          export DOCKER_TAG="${NEW_VERSION}-${ENVIRONMENT}"

          cd target-repo
          git checkout -b "$PR_BRANCH_NAME"

          # Collect service.yaml files
          SERVICE_FILES=()
          mapfile -t SERVICE_FILES < <(find "$DESCRIPTOR_PATH" -type f -name 'service.yaml' 2>/dev/null || true)

          for f in "${SERVICE_FILES[@]}"; do
            echo "Updating $f"
            
            if [ "${USE_SAME_DOCKER_REPO}" = "true" ]; then
              echo "Using the same Docker repository for all services."
              yq eval --inplace '.service.image = (.service.image | sub("-[^:]*$"; "-" + env(DOCKER_TAG)))' "$f"
            else
              echo "Using individual Docker repositories for services."
              yq eval --inplace '.service.image = (.service.image | sub(":[^:]*$"; ":" + env(DOCKER_TAG)))' "$f"
            fi

          done

          git add "${SERVICE_FILES[@]}"
          git commit -m "chore: Create release ${NEW_VERSION}" || echo "No changes to commit"
          git push --set-upstream origin "$PR_BRANCH_NAME"
          
          # Export PR branch name for next step
          echo "PR_BRANCH_NAME=$PR_BRANCH_NAME" >> $GITHUB_ENV

      - name: Create Pull Request
        run: |
          OWNER=$(echo "$TARGET_REPO" | cut -d/ -f1)
          REPO=$(echo "$TARGET_REPO" | cut -d/ -f2)
          BODY="Release: ${NEW_VERSION} for ${ENVIRONMENT}\n\nGenerated tag: ${NEW_VERSION}\nEnvironment: ${ENVIRONMENT}\n\nGenerated by workflow ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID}."

          RESPONSE=$(curl -s -X POST -H "Authorization: token ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${OWNER}/${REPO}/pulls \
            -d "{\"title\": \"chore: Release ${NEW_VERSION} for ${ENVIRONMENT}\", \"head\": \"${PR_BRANCH_NAME}\", \"base\": \"${TARGET_BRANCH}\", \"body\": \"${BODY}\"}")

          echo "$RESPONSE"
          PR_URL=$(echo "$RESPONSE" | grep -o '"html_url": *"[^"]*"' | sed -E 's/"html_url": *"([^"]*)"/\1/')
          if [ -z "$PR_URL" ]; then
            echo "Failed to create PR. Response was:" >&2
            echo "$RESPONSE" >&2
            exit 1
          fi
          echo "Pull request created: $PR_URL"
